[package]
name = "codewig-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "codewig-live — Slint UI for Codewig"

[[bin]]
name = "codewig-live"
path = "src/main.rs"

[dependencies]
codewig-core = { path = "../core" }
slint = "1"
serde_json = "1"
shlex = "1"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
