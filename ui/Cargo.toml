[package]
name = "codewig-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "codewig-live — Slint UI for Codewig"
readme = "../README.md"
repository = "https://github.com/LX-Audiolabs/codewig"

[[bin]]
name = "codewig-live"
path = "src/main.rs"

[dependencies]
codewig-core = { path = "../core" }
slint = "1"
serde_json = "1"
shlex = "2"

[build-dependencies]
slint-build = "1"

# Linux: libfontconfig at runtime via dlopen instead of link-time —
# enables cross-compiling without a fontconfig sysroot (cargo-zigbuild).
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "1", features = ["fontconfig-dlopen"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
