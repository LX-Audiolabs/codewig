[package]
name = "codewig-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "codewig-cli — control Bitwig Studio from the shell"
readme = "../README.md"
repository = "https://github.com/LX-Audiolabs/codewig"

[[bin]]
name = "codewig-cli"
path = "src/main.rs"

[dependencies]
codewig-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
