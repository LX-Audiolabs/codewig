name: appimage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Slint GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libegl1-mesa-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binaries
        run: |
          cargo build -p codewig-live --release
          cargo build -p codewig-cli --release

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps \
                   AppDir/usr/share/icons/hicolor/512x512/apps \
                   AppDir/usr/share/codewig/devices
          cp target/release/codewig-live AppDir/usr/bin/
          cp target/release/codewig-cli AppDir/usr/bin/
          cp packaging/linux/codewig-live.desktop AppDir/usr/share/applications/
          cp assets/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/codewig-live.png
          cp assets/icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/codewig-live.png
          cp devices/*.yaml AppDir/usr/share/codewig/devices/
          cp packaging/linux/codewig-live.desktop AppDir/
          cp assets/icon-256.png AppDir/codewig-live.png

      - name: Fetch appimagetool
        run: |
          curl -sL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            codewig-live-x86_64.AppImage

      - name: Smoke test (binary starts, --help works)
        run: |
          ./codewig-live-x86_64.AppImage --appimage-extract-and-run --version || true
          ./AppDir/usr/bin/codewig-cli --help

      - uses: actions/upload-artifact@v4
        with:
          name: codewig-live-x86_64.AppImage
          path: codewig-live-x86_64.AppImage
