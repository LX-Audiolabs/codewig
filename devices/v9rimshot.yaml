# Bitwig stock mono drum — v9 Rimshot
# Source: live param.list via Codewig Bridge (Bitwig 6.0.11)
# Syntax:  rim&v9rimshot: tune(50) tone(50) output(80)
# Note: no Decay on this device.

id: v9rimshot
bitwig_name: "v9 Rimshot"
kind: bitwig
path_hint:
  windows: "%USERPROFILE%/Documents/Bitwig Studio/Library/Devices"
  linux: "~/Bitwig Studio/Library/Devices"
aliases:
  - "v9 rimshot"
  - "v9rimshot"
  - "v9 rim"
  - "v9rim"
  - "rim.v9"
  - "rimshot.v9"
params:
  tune:
    # CONTENTS/TUNE
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["pitch", "p"]
  tone:
    # CONTENTS/TONE
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  output:
    # CONTENTS/OUTPUT
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["level", "vol", "volume"]
  velocity:
    # CONTENTS/VELOCITY_SENSITIVITY
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["vel", "velocity sensitivity", "velocity_sensitivity"]

