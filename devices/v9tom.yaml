# Bitwig stock mono drum — v9 Tom
# Source: live param.list via Codewig Bridge (Bitwig 6.0.11)
# Syntax:  tom&v9tom: decay(40) punch(50) snap(50) shape(50)

id: v9tom
bitwig_name: "v9 Tom"
kind: bitwig
path_hint:
  windows: "%USERPROFILE%/Documents/Bitwig Studio/Library/Devices"
  linux: "~/Bitwig Studio/Library/Devices"
aliases:
  - "v9 tom"
  - "v9tom"
  - "tom.v9"
  - "tom v9"
params:
  tune:
    # CONTENTS/TUNING — Bitwig UI: Tune
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["pitch", "p", "tuning"]
  decay:
    # CONTENTS/DECAY
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  tone:
    # CONTENTS/TONE
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  shape:
    # CONTENTS/SHAPE
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  snap:
    # CONTENTS/CLICK — Bitwig UI: Snap
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["click"]
  punch:
    # CONTENTS/PUNCH
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  output:
    # CONTENTS/OUTPUT
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["level", "vol", "volume"]
  velocity:
    # CONTENTS/VELOCITY_SENSITIVITY
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["vel", "velocity sensitivity", "velocity_sensitivity"]

