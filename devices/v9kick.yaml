# Bitwig stock mono drum — param support for WIGSCRIPT
# Syntax:  kick&v9kick: decay(50) pitch(40)
# Display 0–100 → wire 0–1

id: v9kick
bitwig_name: "v9 Kick"
kind: bitwig
path_hint:
  windows: "%USERPROFILE%/Documents/Bitwig Studio/Library/Devices"
  linux: "~/Bitwig Studio/Library/Devices"
aliases:
  - "v9 kick"
  - "v9kick"
  - "kick.v9"
  - "kick v9"
params:
  decay:
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  pitch:
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["p"]
