# Bitwig stock mono drum — v9 Clap (TR-909 inspired)
# Source: live param.list via Codewig Bridge (Bitwig 6.0.11)
# Syntax:  clap&v9clap: decay(50) flam(40) width(25)
#
# Direct params (id → display name):
#   CONTENTS/TUNE                 → Tune
#   CONTENTS/DECAY                → Decay
#   CONTENTS/FLAM                 → Flam
#   CONTENTS/WIDTH                → Stereo Width
#   CONTENTS/SOUND_VARIATION      → Sound Variation
#   CONTENTS/OUTPUT               → Output
#   CONTENTS/VELOCITY_SENSITIVITY → Velocity Sensitivity
#   CONTENTS/KEYTRACK             → Keytracking Mode   (toggle)
#
# Display 0–100 → wire 0–1 for floats; bools 0/1.

id: v9clap
bitwig_name: "v9 Clap"
kind: bitwig
path_hint:
  windows: "%USERPROFILE%/Documents/Bitwig Studio/Library/Devices"
  linux: "~/Bitwig Studio/Library/Devices"
aliases:
  - "v9 clap"
  - "v9clap"
  - "clap.v9"
  - "clap v9"
params:
  # ── knobs ────────────────────────────────────────────────────────
  tune:
    # CONTENTS/TUNE
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["pitch", "p"]
  decay:
    # CONTENTS/DECAY
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  flam:
    # CONTENTS/FLAM — density/speed of retriggers
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
  width:
    # CONTENTS/WIDTH — Bitwig UI: Stereo Width
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["stereo", "stereo width", "stereo_width"]
  variation:
    # CONTENTS/SOUND_VARIATION — Bitwig UI: Sound Variation
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["sound variation", "sound_variation", "var"]
  output:
    # CONTENTS/OUTPUT
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["level", "vol", "volume"]
  velocity:
    # CONTENTS/VELOCITY_SENSITIVITY
    wire: [0, 1]
    display: [0, 100]
    unit: "%"
    aliases: ["vel", "velocity sensitivity", "velocity_sensitivity"]

