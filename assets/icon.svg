<?xml version="1.0" encoding="UTF-8"?>
<!-- codewig-live icon — vector master (matches brand: #171717 / #ff731a) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="codewig-live">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="108" fill="#171717"/>

  <g fill="#ff731a" filter="url(#glow)">
    <!-- left chevron < -->
    <path d="M168 156 L92 256 L168 356 L198 328 L146 256 L198 184 Z"/>
    <!-- right chevron > -->
    <path d="M344 156 L420 256 L344 356 L314 328 L366 256 L314 184 Z"/>

    <!-- waveform / equalizer bars (center) -->
    <rect x="214" y="228" width="14" height="56" rx="4"/>
    <rect x="238" y="188" width="16" height="136" rx="5"/>
    <rect x="264" y="148" width="18" height="216" rx="5"/>
    <rect x="292" y="188" width="16" height="136" rx="5"/>
    <rect x="318" y="228" width="14" height="56" rx="4"/>

    <!-- small ticks -->
    <rect x="196" y="244" width="10" height="24" rx="3"/>
    <rect x="340" y="244" width="10" height="24" rx="3"/>
  </g>
</svg>
